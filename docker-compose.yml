services:
  sync:
    # For local development, build from source
    # build: .
    # For production, use released image:
    image: ghcr.io/farhad-a/alexa-photos:latest
    ports:
      - "3000:3000" # Health endpoint + admin UI
      # Login proxy, used only while registering a device.
      # Host and container port MUST match: the proxy rewrites Amazon's pages
      # to embed this address and port, so a remapped host port produces links
      # the browser cannot follow. Keep this on your LAN; it proxies a real
      # Amazon sign-in.
      - "3456:3456"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:3000/health"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3
